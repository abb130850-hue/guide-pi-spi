<body>
  <div id="__bundler_placeholder">Loading Guide PI-SPI — page 1...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"fr\"><head>\n<meta charset=\"utf-8\">\n<title>Guide PI-SPI — page 1<\u002Ftitle>\n<script src=\"53b7269c-a09a-4dcb-a072-311facc0deb7\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"960\"><meta name=\"hz:canvas-height\" content=\"2760\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400 900;\n  font-display: swap;\n  src: url(\"4217e634-299c-488c-a5c5-840d6d692d3b\") format('woff2');\n}\n<\u002Fstyle>\n<style>\nbody{margin:0}\na{color:#0369A1}a:hover{color:#0B1E3F}\n@keyframes pispiDrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n@keyframes pispiFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}\n@keyframes pispiTravel{from{left:0}to{left:calc(100% - 12px)}}\n.pispi-drift{animation:pispiDrift 16s linear infinite}\n.pispi-float{animation:pispiFloat 7s ease-in-out infinite}\n.pispi-dot{animation:pispiTravel 1.8s ease-in-out infinite}\n@media (prefers-reduced-motion: reduce){.pispi-drift,.pispi-float,.pispi-dot{animation:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"box-sizing: border-box; min-height: 100%; background: #FFFFFF; color: #24364F; font-family: 'Inter', system-ui, sans-serif; font-size: 17px; line-height: 1.6\" data-canvas-width=\"960\" data-canvas-height=\"2760\" data-document-role=\"page\" data-label=\"Page 1\">\n\n<header style=\"position: relative; overflow: hidden; background: {{wave}}; color: #0B1E3F; padding: 72px 20px 160px\">\n<div aria-hidden=\"true\" style=\"position: absolute; width: clamp(240px, 40vw, 380px); height: clamp(240px, 40vw, 380px); border-radius: 50%; background: #0B1E3F; right: -100px; top: -120px\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; width: 150px; height: 72px; left: -10px; bottom: 72px; background-image: radial-gradient(#FFFFFF 3px, transparent 3.5px); background-size: 24px 24px; opacity: 0.85\"><\u002Fdiv>\n<div aria-hidden=\"true\" class=\"pispi-float\" style=\"position: absolute; box-sizing: border-box; width: 56px; height: 56px; border-radius: 50%; border: 10px solid #FFFFFF; left: 40%; bottom: 84px\"><\u002Fdiv>\n<div aria-hidden=\"true\" class=\"pispi-float\" style=\"position: absolute; width: 110px; height: 55px; border-radius: 110px 110px 0 0; background: #FFC93C; right: 70px; bottom: 72px; animation-delay: -2.5s\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; width: 72px; height: 72px; border-radius: 72px 0 0 0; background: #FF7A50; right: 0; bottom: 56px\"><\u002Fdiv>\n<div style=\"position: relative; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #0B1E3F\">Service client · Wave<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(68px, 15vw, 128px); line-height: 0.95; font-weight: 900; letter-spacing: -0.045em; color: #0B1E3F\">PI-SPI<\u002Fh1>\n<p style=\"margin: 0; max-width: 520px; font-size: clamp(20px, 3.4vw, 26px); line-height: 1.3; font-weight: 800; letter-spacing: -0.02em; color: #0B1E3F\">Guide de référence pour l'équipe<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px\">\n<span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #0B1E3F; color: #FFFFFF; font-size: 14px; font-weight: 600\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 50%; background: #FFC93C\"><\u002Fspan>Paiement instantané<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.75); color: #0B1E3F; font-size: 14px; font-weight: 600\">BCEAO · UEMOA<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg class=\"pispi-drift\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 2880 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; left: 0; bottom: -1px; width: 200%; height: 70px\"><path fill=\"#FFFFFF\" d=\"M0 35 C240 70 480 0 720 35 C960 70 1200 0 1440 35 C1680 70 1920 0 2160 35 C2400 70 2640 0 2880 35 L2880 70 L0 70 Z\"><\u002Fpath><\u002Fsvg>\n<\u002Fheader>\n\n<main style=\"box-sizing: border-box; max-width: 800px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 72px\">\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: flex-start; gap: 18px\">\n<span style=\"flex: 0 0 56px; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #0B1E3F; background: {{wave}}; box-shadow: 5px 5px 0 #0B1E3F; transform: rotate(-6deg)\">01<\u002Fspan>\n<div style=\"min-width: 0\">\n<p style=\"margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #0369A1\">Présentation<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(26px, 4.2vw, 34px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #0B1E3F\">Une plateforme commune de paiement instantané<\u002Fh2>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #24364F\">La PI-SPI (Plateforme Interopérable du Système de Paiement Instantané), mise en place par la BCEAO, permet d'effectuer des transferts en quelques secondes entre les établissements financiers de l'espace UEMOA.<\u002Fp>\n<div style=\"position: relative; overflow: hidden; display: flex; gap: 18px; align-items: flex-start; background: #0B1E3F; border-radius: 22px; padding: 26px\">\n<div aria-hidden=\"true\" style=\"position: absolute; width: 140px; height: 140px; border-radius: 50%; background: {{wave}}; opacity: 0.22; right: -40px; bottom: -60px\"><\u002Fdiv>\n<span style=\"position: relative; flex: 0 0 48px; width: 48px; height: 48px; border-radius: 14px; background: #FFC93C; color: #0B1E3F; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div style=\"position: relative; min-width: 0\">\n<h3 style=\"margin: 0 0 6px; font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF\">Obligatoire depuis le <span style=\"color: {{wave}}\">2 novembre 2026<\u002Fspan><\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #D4DFEB\">Toutes les transactions interopérables entre banques, opérateurs de monnaie électronique et institutions de microfinance doivent désormais passer par la PI-SPI.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: flex-start; gap: 18px\">\n<span style=\"flex: 0 0 56px; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #0B1E3F; background: #FFC93C; box-shadow: 5px 5px 0 #0B1E3F; transform: rotate(5deg)\">02<\u002Fspan>\n<div style=\"min-width: 0\">\n<p style=\"margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #0369A1\">Notions clés<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(26px, 4.2vw, 34px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #0B1E3F\">Deux notions à connaître<\u002Fh2>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n\n<article style=\"position: relative; overflow: hidden; flex: 1 1 260px; min-width: 0; box-sizing: border-box; border: 1px solid #DCE6F0; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<div aria-hidden=\"true\" style=\"position: absolute; right: -30px; top: -30px; width: 96px; height: 96px; border-radius: 50%; background: #E3F7FF\"><\u002Fdiv>\n<span style=\"position: relative; width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #0B1E3F; background: {{wave}}\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z\"><\u002Fpath><path d=\"M7 7h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h3 style=\"position: relative; margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.02em; color: #0B1E3F\">L'alias<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #24364F\">Identifiant qui renvoie à un seul compte. Un même compte peut en avoir plusieurs : si le client choisit son numéro de téléphone comme alias, le système génère automatiquement une adresse de facturation, qui devient un second alias.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 14px; border-top: 1.5px dashed #DCE6F0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: #F4F8FB; font-size: 14px; font-weight: 600; color: #24364F\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"2\"><\u002Frect><path d=\"M11 18h2\"><\u002Fpath><\u002Fsvg>Alias 1 : téléphone<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: #F4F8FB; font-size: 14px; font-weight: 600; color: #24364F\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 4v6h-6\"><\u002Fpath><path d=\"M20.49 15a9 9 0 1 1-2.12-9.36L23 10\"><\u002Fpath><\u002Fsvg>Alias 2 : généré<\u002Fspan>\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n<span style=\"display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 9px; background: #0B1E3F; font-size: 14px; font-weight: 700; color: #FFFFFF\">Un seul compte<\u002Fspan>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"position: relative; overflow: hidden; flex: 1 1 260px; min-width: 0; box-sizing: border-box; border: 1px solid #DCE6F0; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<div aria-hidden=\"true\" style=\"position: absolute; right: -30px; top: -30px; width: 96px; height: 96px; border-radius: 50%; background: #FFF6DB\"><\u002Fdiv>\n<span style=\"position: relative; width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #0B1E3F; background: #FFC93C\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><path d=\"M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h3 style=\"position: relative; margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.02em; color: #0B1E3F\">Le code QR PI-SPI<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #24364F\">Code standardisé qui identifie un compte. Il permet de recevoir des transferts et des paiements depuis n'importe quelle application participante. On peut l'afficher pour qu'il soit scanné, ou l'envoyer.<\u002Fp>\n<div style=\"margin-top: auto; padding-top: 14px; border-top: 1.5px dashed #DCE6F0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: #F4F8FB; font-size: 14px; font-weight: 600; color: #24364F\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>Afficher<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: #F4F8FB; font-size: 14px; font-weight: 600; color: #24364F\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10\"><\u002Fpath><\u002Fsvg>Scanner<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: #F4F8FB; font-size: 14px; font-weight: 600; color: #24364F\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z\"><\u002Fpath><\u002Fsvg>Envoyer<\u002Fspan>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: flex-start; gap: 18px\">\n<span style=\"flex: 0 0 56px; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #0B1E3F; background: {{wave}}; box-shadow: 5px 5px 0 #0B1E3F; transform: rotate(-6deg)\">03<\u002Fspan>\n<div style=\"min-width: 0\">\n<p style=\"margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #0369A1\">Types de transferts<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(26px, 4.2vw, 34px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #0B1E3F\">Qui peut envoyer à qui<\u002Fh2>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #24364F\">Un transfert peut partir d'une banque ou d'un portefeuille mobile, et arriver dans une autre banque ou un autre portefeuille mobile.<\u002Fp>\n<p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #55667D\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>Appuyez sur une combinaison pour voir le parcours du transfert.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<sc-for list=\"{{routes}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"border: 2px solid {{r.border}}; border-radius: 20px; background: #FFFFFF; overflow: hidden; box-shadow: {{r.shadow}}\">\n<button type=\"button\" sc-camel-on-click=\"{{r.pick}}\" aria-expanded=\"{{r.selected}}\" style=\"box-sizing: border-box; width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: transparent; border: none; font-family: inherit; text-align: left; cursor: pointer; color: #0B1E3F\">\n<span style=\"flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: {{r.numBg}}; color: #0B1E3F; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center\">{{r.num}}<\u002Fspan>\n<span style=\"flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: #F4F8FB; font-size: 15px; font-weight: 700; color: #0B1E3F\">\n<sc-if value=\"{{r.fromBank}}\" hint-placeholder-val=\"{{ true }}\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-7 10 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{r.fromWallet}}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"2\"><\u002Frect><path d=\"M11 18h2\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n{{r.from}}<\u002Fspan>\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n<span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: #E3F7FF; font-si  2px dashed #94A3B8; background: #FFFFFF; color: #33475B; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center\">{{r.exFromLogo}}<\u002Fspan>\n{{r.exFrom}}<\u002Fspan>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: relative; flex: 0 1 44px; min-width: 20px; align-self: center; height: 3px; background: repeating-linear-gradient(90deg, {{wave}} 0 6px, transparent 6px 12px)\"><span class=\"pispi-dot\" style=\"position: absolute; top: 50%; left: 0; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #FFC93C; box-shadow: 0 0 0 4px rgba(255,201,60,0.35)\"><\u002Fspan><\u002Fdiv>\n<div style=\"flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #0B1E3F; border-radius: 14px; padding: 12px 14px; text-align: center\">\n<span style=\"font-size: 17px; font-weight: 900; color: {{wave}}\">PI-SPI<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 600; color: #D4DFEB\">instantané<\u002Fspan>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: relative; flex: 0 1 44px; min-width: 20px; align-self: center; height: 3px; background: repeating-linear-gradient(90deg, {{wave}} 0 6px, transparent 6px 12px)\"><span class=\"pispi-dot\" style=\"position: absolute; top: 50%; left: 0; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #FFC93C; box-shadow: 0 0 0 4px rgba(255,201,60,0.35)\"><\u002Fspan><\u002Fdiv>\n<div style=\"flex: 1 1 0; min-width: 0; box-sizing: border-box; background: #F4F8FB; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #55667D\">Destinataire<\u002Fspan>\n<span style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; line-height: 1.3; font-weight: 700; color: #0B1E3F\">\n<sc-if value=\"{{r.hasToLogo}}\" hint-placeholder-val=\"{{ true }}\"><span title=\"Emplacement du logo\" style=\"flex: 0 0 36px; width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #94A3B8; background: #FFFFFF; color: #33475B; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center\">{{r.exToLogo}}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{r.noToLogo}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; background: #E3F7FF; color: #0369A1; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-7 10 7\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsc-if>\n{{r.exTo}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #24364F\"><strong style=\"color: #0B1E3F\">Ex. :<\u002Fstrong> {{r.example}}, en quelques secondes.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<figure style=\"position: relative; overflow: hidden; margin: 0; border-radius: 26px; padding: 56px clamp(22px, 5vw, 48px) 48px; text-align: center; background: {{wave}}\">\n<div aria-hidden=\"true\" style=\"position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #FFC93C; left: -24px; top: -24px\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; width: 48px; height: 48px; border-radius: 0 0 0 48px; background: #0B1E3F; right: 0; top: 0\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; width: 26px; height: 26px; border-radius: 7px; background: #FF7A50; right: 20px; bottom: 14px; transform: rotate(14deg)\"><\u002Fdiv>\n<p style=\"position: relative; margin: 0; font-size: clamp(22px, 3.6vw, 30px); line-height: 1.3; font-weight: 800; letter-spacing: -0.015em; color: #0B1E3F\">Une banque, un portefeuille, un alias : <span style=\"background: #FFFFFF; padding: 0 6px; border-radius: 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone\">tout passe désormais par la même plateforme.<\u002Fspan><\u002Fp>\n<\u002Ffigure>\n\n<a href=\"Page2.dc.html\" style=\"position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 16px; text-decoration: none; background: #0B1E3F; border-radius: 22px; padding: 24px 26px; color: #FFFFFF\">\n<span style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: {{wave}}\">Page suivante<\u002Fspan>\n<span style=\"font-size: 19px; line-height: 1.35; font-weight: 800; letter-spacing: -0.015em; color: #FFFFFF\">Envoyer, se faire payer, rester vigilant<\u002Fspan>\n<\u002Fspan>\n<span style=\"flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%; background: {{wave}}; color: #0B1E3F; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fa>\n\n<\u002Fmain>\n\n<footer style=\"background: #0B1E3F; color: #C9D6E3; padding: 32px 20px\">\n<div style=\"max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; font-size: 14px; line-height: 1.5\">\n<span style=\"display: flex; flex-direction: column\"><span><strong style=\"color: #FFFFFF; font-weight: 900\">PI-SPI<\u002Fstrong> · Guide de référence pour l'équipe<\u002Fspan><span>Document interne · par Marie Françoise Sarr · Page 1 / 2<\u002Fspan><\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #16305C; color: #FFFFFF; font-weight: 600\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 50%; background: #FF7A50\"><\u002Fspan>Diffusion interne uniquement<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;wave&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1DC8FF&quot;,&quot;options&quot;:[&quot;#1DC8FF&quot;,&quot;#00B4F0&quot;,&quot;#38BDF8&quot;,&quot;#0EA5E9&quot;]},&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:2760}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { route: 0 };\n  }\n  renderVals() {\n    const wave = this.props.wave ?? \"#1DC8FF\";\n    const sel = this.state.route;\n    const data = [\n      { fromBank: true, toBank: false, from: \"Banque\", to: \"Portefeuille mobile\", exFrom: \"BOA\", exFromLogo: \"BOA\", exTo: \"Mon compte Wave\", exToLogo: \"W\", example: \"de la BOA vers mon compte Wave\" },\n      { fromBank: false, toBank: true, from: \"Portefeuille mobile\", to: \"Banque\", exFrom: \"Wave\", exFromLogo: \"W\", exTo: \"Mon compte bancaire\", exToLogo: \"\", example: \"de Wave vers mon compte bancaire\" },\n      { fromBank: true, toBank: true, from: \"Banque\", to: \"Banque\", exFrom: \"BOA\", exFromLogo: \"BOA\", exTo: \"Une banque islamique\", exToLogo: \"\", example: \"de la BOA vers une banque islamique\" },\n      { fromBank: false, toBank: false, from: \"Portefeuille mobile\", to: \"Portefeuille mobile\", exFrom: \"Wave\", exFromLogo: \"W\", exTo: \"Orange Money\", exToLogo: \"OM\", example: \"de Wave vers Orange Money\" }\n    ];\n    const routes = data.map((r, i) => {\n      const on = i === sel;\n      return Object.assign({}, r, {\n        num: String(i + 1),\n        fromWallet: !r.fromBank,\n        toWallet: !r.toBank,\n        hasToLogo: r.exToLogo !== \"\",\n        noToLogo: r.exToLogo === \"\",\n        selected: on,\n        border: on ? \"#0B1E3F\" : \"#DCE6F0\",\n        shadow: on ? \"6px 6px 0 \" + wave : \"none\",\n        numBg: on ? wave : \"#F4F8FB\",\n        rot: on ? \"90deg\" : \"0deg\",\n        pick: () => this.setState({ route: i })\n      });\n    });\n    return { wave: wave, routes: routes };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
